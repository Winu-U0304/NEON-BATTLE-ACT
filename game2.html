<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEO BATTLE ACT - ULTIMATE</title>
    <style>
        body {
            background-color: #030308;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }
        h1 {
            margin: 0 0 6px 0;
            font-size: 20px;
            letter-spacing: 3px;
            color: #ff0077;
            text-shadow: 0 0 20px #ff0077;
        }
        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 68vh;
            max-height: 650px;
            background: #0a0a12;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0,255,255,0.15);
            overflow: hidden;
            border: 2px solid #222244;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #111122 0%, #030308 100%);
            cursor: ew-resize;
        }
        .external-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 480px;
            margin-top: 10px;
            gap: 12px;
            padding: 0 4px;
            box-sizing: border-box;
        }
        .ctrl-btn {
            flex: 1;
            background: linear-gradient(135deg, #111122, #2a2a48);
            color: #00ffff;
            border: 2px solid #00ffff44;
            padding: 12px 0;
            font-size: 20px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,255,255,0.1);
            text-align: center;
            transition: transform 0.05s, background 0.1s, border-color 0.1s;
        }
        .ctrl-btn:active, .ctrl-btn.pressed {
            transform: scale(0.94);
            background: linear-gradient(135deg, #ff0077, #7700ff);
            color: #fff;
            border-color: #ff0077;
            box-shadow: 0 0 15px rgba(255,0,119,0.5);
        }

        #damage-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 80, 0.4);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.08s ease-out;
            z-index: 10;
        }
        .ui-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 12, 0.94);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            transition: opacity 0.3s ease;
        }
        .hidden {
            display: none !important;
        }
        .menu-btn {
            background: linear-gradient(135deg, #ff0077, #7700ff);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255,0,119,0.5);
            margin: 6px;
            transition: transform 0.1s, filter 0.1s;
            width: 80%;
            max-width: 240px;
        }
        .menu-btn:active {
            transform: scale(0.95);
            filter: brightness(0.9);
        }
        .menu-btn.secondary {
            background: linear-gradient(135deg, #222233, #444466);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .menu-btn.save-btn {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            box-shadow: 0 4px 20px rgba(0,180,219,0.4);
        }
        .setting-group {
            margin: 10px 0;
            text-align: center;
            width: 80%;
        }
        .setting-group label {
            display: block;
            font-size: 12px;
            color: #8888aa;
            margin-bottom: 4px;
        }
        .setting-group select, .setting-group input[type="range"] {
            width: 100%;
            padding: 6px;
            background: #111122;
            color: #fff;
            border: 1px solid #333355;
            border-radius: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>NEO BATTLE ACT</h1>
    <div class="game-wrapper" id="gameWrapper">
        <canvas id="gameCanvas"></canvas>
        <div id="damage-overlay"></div>

        <div id="titleScreen" class="ui-screen hidden">
            <h2 style="color: #00ffff; font-size: 24px; margin-bottom: 15px; text-shadow: 0 0 15px #00ffff; letter-spacing: 2px;">ULTIMATE EDITION</h2>
            <button class="menu-btn" id="startBtn">GAME START</button>
            <button class="menu-btn secondary" id="configBtn">SETTINGS</button>
        </div>

        <div id="configScreen" class="ui-screen hidden">
            <h2 style="color: #ffcc00; font-size: 20px; margin-bottom: 10px;">SETTINGS</h2>
            <div class="setting-group">
                <label>難易度 (DIFFICULTY)</label>
                <select id="diffSelect">
                    <option value="easy">EASY (やさしい)</option>
                    <option value="normal" selected>NORMAL (ふつう)</option>
                    <option value="hard">HARD (鬼畜)</option>
                </select>
            </div>
            <div class="setting-group">
                <label>マスター音量 (VOLUME)</label>
                <input type="range" id="volRange" min="0" max="1" step="0.1" value="0.5">
            </div>
            <div class="setting-group">
                <label>効果音 (SE)</label>
                <select id="seSelect">
                    <option value="on" selected>ON</option>
                    <option value="off">OFF</option>
                </select>
            </div>
            <button class="menu-btn" id="backBtn" style="margin-top: 15px;">BACK</button>
        </div>

        <div id="clearScreen" class="ui-screen hidden">
            <h2 style="color: #00ffcc; font-size: 26px; margin-bottom: 5px; text-shadow: 0 0 20px #00ffcc;">STAGE CLEAR!!</h2>
            <p id="clearScoreText" style="color: #fff; font-size: 15px; margin-bottom: 15px;"></p>
            <button class="menu-btn save-btn" id="saveClearImgBtn">📷 結果を画像で保存</button>
            <button class="menu-btn" id="retryClearBtn">再挑戦</button>
            <button class="menu-btn secondary" id="homeClearBtn">ホームに戻る</button>
        </div>

        <div id="gameOverScreen" class="ui-screen hidden">
            <h2 style="color: #ff0077; font-size: 26px; margin-bottom: 5px; text-shadow: 0 0 20px #ff0077;">GAME OVER</h2>
            <p id="overScoreText" style="color: #fff; font-size: 15px; margin-bottom: 15px;"></p>
            <button class="menu-btn save-btn" id="saveOverImgBtn">📷 結果を画像で保存</button>
            <button class="menu-btn" id="retryOverBtn">再挑戦</button>
            <button class="menu-btn secondary" id="homeOverBtn">ホームに戻る</button>
        </div>
    </div>

    <!-- 枠外の操作用ボタン（左移動・右移動） -->
    <div class="external-controls">
        <button class="ctrl-btn" id="leftBtn">◀ LEFT</button>
        <button class="ctrl-btn" id="rightBtn">RIGHT ▶</button>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const damageOverlay = document.getElementById('damage-overlay');

const titleScreen = document.getElementById('titleScreen');
const configScreen = document.getElementById('configScreen');
const clearScreen = document.getElementById('clearScreen');
const gameOverScreen = document.getElementById('gameOverScreen');

const leftBtn = document.getElementById('leftBtn');
const rightBtn = document.getElementById('rightBtn');

function resizeCanvas() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let settings = { difficulty: 'normal', volume: 0.5, se: 'on' };

let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        window.AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
    if (settings.se === 'off' || !audioCtx) return;
    try {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        let now = audioCtx.currentTime;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        gain.gain.setValueAtTime(settings.volume, now);

        if (type === 'drop') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1400, now);
            osc.frequency.exponentialRampToValueAtTime(300, now + 0.4);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
        } else if (type === 'shot') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(250, now + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'enemyShot') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(450, now);
            osc.frequency.exponentialRampToValueAtTime(120, now + 0.15);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'shrink') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(500, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.12);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            osc.start(now); osc.stop(now + 0.12);
        } else if (type === 'explode') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(350, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'damage') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(130, now);
            osc.frequency.linearRampToValueAtTime(40, now + 0.15);
            gain.gain.setValueAtTime(settings.volume * 1.5, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'heal') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(1000, now + 0.2);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'click') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(400, now + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'pop') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(900, now);
            osc.frequency.exponentialRampToValueAtTime(300, now + 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'clear') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.15);
            osc.frequency.setValueAtTime(783.99, now + 0.3);
            osc.frequency.setValueAtTime(1046.50, now + 0.45);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
            osc.start(now); osc.stop(now + 0.8);
        }
    } catch(e) {}
}

let gameState = 'INTRO';
let introProgress = 0.0;
const introTitleText = "NEO BATTLE ACT";

let player = { 
    x: 0, 
    y: 0, 
    targetX: 0, 
    radius: 16, 
    color: '#00ffff',
    lives: 3,
    invincibleTimer: 0
};

let enemies = [];
let bullets = [];      
let enemyBullets = []; 
let particles = [];
let items = [];        
let boss = null;       
let bgStars = [];      

let keys = { left: false, right: false };
let buttonState = { left: false, right: false };

function initBgStars() {
    bgStars = [];
    for (let i = 0; i < 70; i++) {
        bgStars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2.2 + 0.5,
            speed: Math.random() * 0.8 + 0.3,
            twinkleSpeed: Math.random() * 0.05 + 0.02,
            alpha: Math.random()
        });
    }
}

let score = 0;
let frameCount = 0;

function hideAllScreens() {
    titleScreen.classList.add('hidden');
    configScreen.classList.add('hidden');
    clearScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
}

document.getElementById('startBtn').addEventListener('click', () => {
    playSound('click');
    hideAllScreens();
    resetGame();
});
document.getElementById('configBtn').addEventListener('click', () => {
    playSound('click');
    hideAllScreens();
    configScreen.classList.remove('hidden');
});
document.getElementById('backBtn').addEventListener('click', () => {
    playSound('click');
    hideAllScreens();
    titleScreen.classList.remove('hidden');
});

document.getElementById('retryClearBtn').addEventListener('click', () => { playSound('click'); hideAllScreens(); resetGame(); });
document.getElementById('homeClearBtn').addEventListener('click', () => { playSound('click'); hideAllScreens(); titleScreen.classList.remove('hidden'); });

document.getElementById('retryOverBtn').addEventListener('click', () => { playSound('click'); hideAllScreens(); resetGame(); });
document.getElementById('homeOverBtn').addEventListener('click', () => { playSound('click'); hideAllScreens(); titleScreen.classList.remove('hidden'); });

// --- 画像保存機能 ---
function saveGameResultImage() {
    playSound('click');
    // 現在のキャンバス描画状態を一時的な画像リンクにしてダウンロード
    const link = document.createElement('a');
    link.download = `neo-battle-act-score-${score}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
}

document.getElementById('saveClearImgBtn').addEventListener('click', saveGameResultImage);
document.getElementById('saveOverImgBtn').addEventListener('click', saveGameResultImage);

document.getElementById('diffSelect').addEventListener('change', (e) => { settings.difficulty = e.target.value; });
document.getElementById('volRange').addEventListener('input', (e) => { settings.volume = parseFloat(e.target.value); });
document.getElementById('seSelect').addEventListener('change', (e) => { settings.se = e.target.value; });

function updatePointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    let clientX = e.clientX || (e.touches && e.touches[0].clientX);
    if (clientX !== undefined) {
        player.targetX = clientX - rect.left;
    }
}

window.addEventListener('mousemove', (e) => { initAudio(); if (gameState === 'PLAYING') updatePointerPos(e); });
window.addEventListener('touchmove', (e) => { initAudio(); if (gameState === 'PLAYING') updatePointerPos(e); }, { passive: true });
window.addEventListener('touchstart', (e) => { initAudio(); if (gameState === 'PLAYING') updatePointerPos(e); }, { passive: true });

window.addEventListener('keydown', (e) => {
    initAudio();
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
});

window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
});

function setupHoldButton(btn, direction) {
    const pressOn = (e) => { e.preventDefault(); initAudio(); buttonState[direction] = true; btn.classList.add('pressed'); };
    const pressOff = (e) => { e.preventDefault(); buttonState[direction] = false; btn.classList.remove('pressed'); };

    btn.addEventListener('mousedown', pressOn);
    btn.addEventListener('mouseup', pressOff);
    btn.addEventListener('mouseleave', pressOff);
    btn.addEventListener('touchstart', pressOn, { passive: false });
    btn.addEventListener('touchend', pressOff, { passive: false });
    btn.addEventListener('touchcancel', pressOff, { passive: false });
}

setupHoldButton(leftBtn, 'left');
setupHoldButton(rightBtn, 'right');

function spawnEnemy() {
    if (gameState !== 'PLAYING') return;
    
    if (!boss && score >= 3000) {
        spawnBoss();
        return;
    }

    const radius = 14 + Math.random() * 20;
    const colors = ['#ff0077', '#ff7700', '#7700ff', '#00ffcc'];
    let speedMult = settings.difficulty === 'easy' ? 0.85 : (settings.difficulty === 'hard' ? 1.4 : 1.1);

    enemies.push({
        x: Math.random() * (canvas.width - radius * 2) + radius,
        y: -radius * 2,
        radius: radius,
        targetRadius: radius,
        maxRadius: radius,
        speed: (1.5 + Math.random() * 2.0) * speedMult,
        hp: radius > 24 ? 2 : 1,
        color: colors[Math.floor(Math.random() * colors.length)],
        angle: Math.random() * Math.PI * 2,
        shootTimer: 0
    });

    let interval = settings.difficulty === 'easy' ? 900 : (settings.difficulty === 'hard' ? 450 : 650);
    setTimeout(spawnEnemy, Math.max(200, interval - (score / 35)));
}

function spawnBoss() {
    playSound('drop');
    boss = {
        x: canvas.width / 2,
        y: -60,
        targetY: 90,
        radius: 42,
        targetRadius: 42,
        maxHp: 40,
        hp: 40,
        color: '#ff0055',
        angle: 0,
        shootCooldown: 0
    };
}

function shoot3Way() {
    const bSpeed = 8.0; 
    const bRadius = 5;
    const color = '#00ffff';
    const rad15 = 15 * (Math.PI / 180);

    bullets.push({ x: player.x, y: player.y - player.radius, vx: 0, vy: -bSpeed, radius: bRadius, color: color, history: [] });
    bullets.push({ x: player.x, y: player.y - player.radius, vx: -bSpeed * Math.sin(rad15), vy: -bSpeed * Math.cos(rad15), radius: bRadius, color: color, history: [] });
    bullets.push({ x: player.x, y: player.y - player.radius, vx: bSpeed * Math.sin(rad15), vy: -bSpeed * Math.cos(rad15), radius: bRadius, color: color, history: [] });

    playSound('shot');
}

function createExplosion(x, y, color, count = 15) {
    playSound('explode');
    for (let i = 0; i < count; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = 1 + Math.random() * 5;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            radius: 2 + Math.random() * 4,
            color: color,
            alpha: 1.0,
            decay: 0.02 + Math.random() * 0.025
        });
    }
}

function spawnConfetti() {
    const colors = ['#ff0077', '#00ffcc', '#ffcc00', '#7700ff', '#ffffff', '#ff3366'];
    for (let i = 0; i < 120; i++) {
        particles.push({
            x: canvas.width / 2,
            y: canvas.height / 2,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.7) * 7 - 2,
            radius: 3 + Math.random() * 5,
            color: colors[Math.floor(Math.random() * colors.length)],
            alpha: 1.0,
            decay: 0.006 + Math.random() * 0.01,
            isConfetti: true,
            rot: Math.random() * Math.PI,
            vRot: (Math.random() - 0.5) * 0.2
        });
    }
}

function triggerDamageAnim() {
    playSound('damage');
    damageOverlay.style.opacity = '1';
    setTimeout(() => { damageOverlay.style.opacity = '0'; }, 100);

    const gameWrapper = document.getElementById('gameWrapper');
    gameWrapper.style.transform = `translate(${Math.random()*14-7}px, ${Math.random()*14-7}px)`;
    setTimeout(() => { gameWrapper.style.transform = 'translate(0, 0)'; }, 70);
}

function update() {
    for (let s of bgStars) {
        s.y += s.speed;
        s.alpha += Math.sin(frameCount * s.twinkleSpeed) * 0.015;
        if (s.y > canvas.height) {
            s.y = 0;
            s.x = Math.random() * canvas.width;
        }
    }

    if (gameState === 'INTRO') {
        introProgress += 0.010; 
        
        let currentLetterCount = Math.floor(introProgress * introTitleText.length);
        if (currentLetterCount > (window.lastPlayedLetterCount || 0) && currentLetterCount <= introTitleText.length) {
            playSound('pop');
            window.lastPlayedLetterCount = currentLetterCount;
        }

        if (introProgress >= 1.45) {
            introProgress = 1.0;
            window.lastPlayedLetterCount = 0;
            playSound('drop');
            gameState = 'TITLE';
            titleScreen.classList.remove('hidden');
        }
        return;
    }

    if (gameState !== 'PLAYING') return;

    frameCount++;

    if (player.invincibleTimer > 0) {
        player.invincibleTimer--;
    }

    const moveSpeed = 6.5;
    if (keys.left || buttonState.left) player.targetX -= moveSpeed;
    if (keys.right || buttonState.right) player.targetX += moveSpeed;

    let dx = player.targetX - player.x;
    player.x += dx * 0.2;
    player.y = canvas.height - 80; 
    player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
    player.targetX = Math.max(player.radius, Math.min(canvas.width - player.radius, player.targetX));

    if (frameCount % 18 === 0) shoot3Way();

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; 
        p.y += p.vy;
        if (p.isConfetti) {
            p.vy += 0.12;
            p.rot += p.vRot;
        }
        p.alpha -= p.decay;
        if (p.alpha <= 0) particles.splice(i, 1);
    }

    for (let i = items.length - 1; i >= 0; i--) {
        let it = items[i];
        it.y += 1.5;
        let distSq = (player.x - it.x) ** 2 + (player.y - it.y) ** 2;
        if (distSq < (player.radius + it.radius) ** 2) {
            playSound('heal');
            player.lives = Math.min(3, player.lives + 1);
            items.splice(i, 1);
            continue;
        }
        if (it.y > canvas.height + 20) items.splice(i, 1);
    }

    if (boss) {
        if (boss.y < boss.targetY) {
            boss.y += 1.5;
        } else {
            boss.angle += 0.025;
            boss.x = canvas.width / 2 + Math.sin(boss.angle) * 120;
        }

        boss.shootCooldown++;
        if (boss.shootCooldown > 40) {
            boss.shootCooldown = 0;
            playSound('enemyShot');
            let angleToPlayer = Math.atan2(player.y - boss.y, player.x - boss.x);
            for (let offset of [-0.3, -0.15, 0, 0.15, 0.3]) {
                enemyBullets.push({
                    x: boss.x, y: boss.y + boss.radius,
                    vx: Math.cos(angleToPlayer + offset) * 3.5,
                    vy: Math.sin(angleToPlayer + offset) * 3.5,
                    radius: 5,
                    color: '#ff3366'
                });
            }
        }
        boss.radius += (boss.targetRadius - boss.radius) * 0.1;
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.history.unshift({ x: b.x, y: b.y });
        if (b.history.length > 5) b.history.pop();

        b.x += b.vx;
        b.y += b.vy;

        if (b.y < -20 || b.x < -20 || b.x > canvas.width + 20) {
            bullets.splice(i, 1);
            continue;
        }

        if (boss && (b.x - boss.x)**2 + (b.y - boss.y)**2 < (boss.radius + b.radius)**2) {
            bullets.splice(i, 1);
            boss.hp--;
            boss.targetRadius = boss.radius * 0.95;
            setTimeout(() => { if (boss) boss.targetRadius = 42; }, 80);

            if (boss.hp <= 0) {
                createExplosion(boss.x, boss.y, '#ff0055', 40);
                score += 1500;
                boss = null;
                
                playSound('clear');
                gameState = 'CLEAR';
                spawnConfetti();
                document.getElementById('clearScoreText').innerText = `FINAL SCORE: ${score}`;
                clearScreen.classList.remove('hidden');
                return;
            } else {
                playSound('shrink');
            }
            continue;
        }

        for (let j = enemies.length - 1; j >= 0; j--) {
            let en = enemies[j];
            let distSq = (b.x - en.x) ** 2 + (b.y - en.y) ** 2;
            if (distSq < (b.radius + en.radius) ** 2) {
                bullets.splice(i, 1);
                en.hp--;

                if (en.hp <= 0) {
                    createExplosion(en.x, en.y, en.color);
                    if (Math.random() < 0.25) {
                        items.push({ x: en.x, y: en.y, radius: 10 });
                    }
                    enemies.splice(j, 1);
                    score += Math.floor(en.maxRadius) * 4;
                } else {
                    playSound('shrink');
                    en.targetRadius = en.radius * 0.65;
                    score += 40;
                }
                break;
            }
        }
    }

    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        let eb = enemyBullets[i];
        eb.x += eb.vx;
        eb.y += eb.vy;

        if (eb.y > canvas.height + 20 || eb.x < -20 || eb.x > canvas.width + 20) {
            enemyBullets.splice(i, 1);
            continue;
        }

        let distSq = (player.x - eb.x) ** 2 + (player.y - eb.y) ** 2;
        if (distSq < (player.radius + eb.radius) ** 2) {
            enemyBullets.splice(i, 1);
            if (player.invincibleTimer <= 0) {
                player.lives--;
                triggerDamageAnim();
                player.invincibleTimer = 60;
                if (player.lives <= 0) {
                    gameState = 'GAMEOVER';
                    document.getElementById('overScoreText').innerText = `FINAL SCORE: ${score}`;
                    gameOverScreen.classList.remove('hidden');
                }
            }
        }
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
        let en = enemies[i];
        en.y += en.speed;
        en.radius += (en.targetRadius - en.radius) * 0.15;

        en.shootTimer++;
        if (en.shootTimer > 60 && Math.random() < 0.08) {
            en.shootTimer = 0;
            playSound('enemyShot');
            let angle = Math.atan2(player.y - en.y, player.x - en.x);
            enemyBullets.push({
                x: en.x, y: en.y,
                vx: Math.cos(angle) * 3.0,
                vy: Math.sin(angle) * 3.0,
                radius: 4,
                color: '#ff6600'
            });
        }

        let distSq = (player.x - en.x) ** 2 + (player.y - en.y) ** 2;
        if (distSq < (player.radius + en.radius * 0.8) ** 2) {
            createExplosion(en.x, en.y, en.color);
            enemies.splice(i, 1);
            if (player.invincibleTimer <= 0) {
                player.lives--;
                triggerDamageAnim();
                player.invincibleTimer = 60;
                if (player.lives <= 0) {
                    gameState = 'GAMEOVER';
                    document.getElementById('overScoreText').innerText = `FINAL SCORE: ${score}`;
                    gameOverScreen.classList.remove('hidden');
                }
            }
            continue;
        }

        if (en.y > canvas.height + en.radius) {
            enemies.splice(i, 1);
            score = Math.max(0, score - 30);
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let s of bgStars) {
        ctx.save();
        ctx.globalAlpha = Math.max(0.1, Math.min(1.0, s.alpha));
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = s.size * 3;
        ctx.shadowColor = '#00ffff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    if (gameState === 'INTRO') {
        let p = introProgress;
        let alpha = 1.0;
        if (p > 1.0) alpha = Math.max(0, 1.0 - (p - 1.0) / 0.45);

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        let centerX = canvas.width / 2;
        let centerY = canvas.height / 2 - 30;

        let podScale = Math.min(1.0, p * 1.5);
        ctx.shadowBlur = 30 * podScale;
        ctx.shadowColor = '#00ffff';
        ctx.fillStyle = '#00ffff';
        ctx.beginPath();
        ctx.arc(centerX, centerY - 40, 25 * podScale, 0, Math.PI * 2);
        ctx.fill();

        let visibleCharsCount = Math.min(introTitleText.length, Math.floor(p * introTitleText.length * 1.2));
        let currentText = introTitleText.substring(0, visibleCharsCount);

        let fontSize = 24;
        if (p >= 0.8 && p <= 1.0) fontSize = 24 + (p - 0.8) * 60;
        else if (p > 1.0) fontSize = 36;

        ctx.font = `bold ${fontSize}px sans-serif`;
        ctx.fillStyle = '#ff0077';
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#ff0077';
        ctx.fillText(currentText, centerX, centerY + 30);

        ctx.restore();
        return;
    }

    for (let p of particles) {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = p.color;
        if (p.isConfetti) {
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillRect(-p.radius, -p.radius / 2, p.radius * 2, p.radius);
        } else {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    for (let it of items) {
        ctx.save();
        ctx.fillStyle = '#00ff77';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00ff77';
        ctx.beginPath();
        ctx.arc(it.x, it.y, it.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('+', it.x, it.y + 3);
        ctx.restore();
    }

    for (let b of bullets) {
        for (let idx = 0; idx < b.history.length; idx++) {
            let h = b.history[idx];
            let alpha = (1 - idx / b.history.length) * 0.4;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = b.color;
            ctx.beginPath();
            ctx.arc(h.x, h.y, b.radius * 0.8, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        ctx.save();
        ctx.fillStyle = b.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    for (let eb of enemyBullets) {
        ctx.save();
        ctx.fillStyle = eb.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = eb.color;
        ctx.beginPath();
        ctx.arc(eb.x, eb.y, eb.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    if (boss) {
        ctx.save();
        ctx.fillStyle = boss.color;
        ctx.shadowBlur = 25;
        ctx.shadowColor = boss.color;
        ctx.beginPath();
        ctx.arc(boss.x, boss.y, boss.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(boss.x, boss.y, boss.radius * 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    for (let en of enemies) {
        ctx.save();
        ctx.fillStyle = en.color;
        ctx.shadowBlur = 15;
        ctx.shadowColor = en.color;
        ctx.beginPath();
        ctx.arc(en.x, en.y, en.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(en.x - en.radius*0.3, en.y - en.radius*0.3, en.radius * 0.25, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    if (player.invincibleTimer === 0 || Math.floor(player.invincibleTimer / 4) % 2 === 0) {
        ctx.save();
        ctx.fillStyle = player.color;
        ctx.shadowBlur = 20;
        ctx.shadowColor = player.color;
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius * 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(`SCORE: ${score}`, 15, 25);
    ctx.fillStyle = boss ? '#ff0055' : '#00ffcc';
    ctx.fillText(boss ? '⚠️ BOSS BATTLE' : `🎯 BOSS APPEAR AT 3000 (${Math.floor(score/30)}%)`, 15, 45);

    ctx.fillText('LIVES:', canvas.width - 125, 25);
    for (let i = 0; i < player.lives; i++) {
        ctx.save();
        ctx.fillStyle = '#00ffff';
        ctx.beginPath();
        ctx.arc(canvas.width - 70 + (i * 20), 21, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    if (boss) {
        ctx.fillStyle = '#ff0055';
        ctx.fillRect(canvas.width/2 - 75, 60, 150 * (boss.hp / boss.maxHp), 5);
    }
}

function resetGame() {
    player.x = canvas.width / 2;
    player.targetX = canvas.width / 2;
    player.lives = 3;
    player.invincibleTimer = 0;
    enemies = [];
    bullets = [];
    enemyBullets = [];
    particles = [];
    items = [];
    boss = null;
    score = 0;
    frameCount = 0;
    gameState = 'PLAYING';
    spawnEnemy();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

initBgStars();
loop();
</script>
